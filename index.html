<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Playtime Calendar</title>

  <style>
    body {
      background-color: #0f1a2b;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      touch-action: pan-y;
      overflow-x: hidden;
    }

    h1 {
      margin-bottom: 20px;
      text-align: center;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      max-width: 500px;
      transition: transform 0.3s ease;
    }

    .day {
      width: 60px;
      height: 60px;
      background-color: #1a2b3d;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .day.played {
      background-color: #1e824c;
    }

    .day.today {
      border: 2px solid #00aced;
    }

    .day span {
      font-size: 20px;
    }

    /* POPUP */

    .popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
      box-sizing: border-box;
    }

    .popupContent {
      background: #1a2b3d;
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 20px;
      box-sizing: border-box;
    }

    .popupTitle {
      font-size: 1.3rem;
      margin-bottom: 15px;
      text-align: center;
    }

    .gameCard {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #24384f;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .gameCard img {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      object-fit: cover;
      background: #111;
    }

    .gameInfo {
      flex: 1;
    }

    .gameName {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .gameTime {
      color: #ccc;
      font-size: 0.9rem;
    }

  </style>
</head>

<body>

  <h1 id="calendar-title">Loading...</h1>

  <div class="calendar" id="calendar"></div>

  <!-- POPUP -->
  <div class="popup" id="popup" onclick="closePopup()">

    <div class="popupContent" onclick="event.stopPropagation()">

      <div class="popupTitle" id="popupTitle"></div>

      <div id="popupGames"></div>

    </div>

  </div>

  <script>

    const csvUrl =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vRo-SarpignS39lDSaIGsV13WyUJOURcyVaRP_mEqY6XfBxby9WA_XCf5AhXi8OcwHDiP4FLqBwMGKw/pub?output=csv";

    // 🔥 GAME DATA API
    const gameApi =
      "https://script.google.com/macros/s/AKfycby5tKKny4hqGyG--JQxP4IVe2C8WWGO6sMij6p66MdSmLFVDUn6TbeBbM2L51TdWia_/exec";

    let currentDate = new Date();

    let gameData = [];

    async function fetchData() {
      const res = await fetch(csvUrl);
      const text = await res.text();
      const rows = text.trim().split("\n").slice(1).map(row => row.split(","));
      return rows;
    }

    async function fetchGameData() {
      const res = await fetch(gameApi);
      gameData = await res.json();
    }

    function getMonthDays(year, month) {
      const date = new Date(year, month, 1);
      const days = [];

      while (date.getMonth() === month) {
        days.push(new Date(date));
        date.setDate(date.getDate() + 1);
      }

      return days;
    }

    async function buildCalendar() {

      const calendar = document.getElementById("calendar");
      const title = document.getElementById("calendar-title");

      calendar.innerHTML = "";

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const today = new Date();

      const isCurrentMonth =
        (month === today.getMonth() &&
        year === today.getFullYear());

      const monthName =
        currentDate.toLocaleString("default", {
          month: "long"
        });

      title.textContent =
        `${monthName} ${year} Play Calendar`;

      const allRows = await fetchData();

      await fetchGameData();

      const playedDates = new Set();

      for (const row of allRows) {

        const rawDate = row[0];
        const minutesPlayed = parseInt(row[4]) || 0;

        const date = new Date(rawDate);

        if (
          date.getFullYear() === year &&
          date.getMonth() === month &&
          minutesPlayed > 0
        ) {
          playedDates.add(date.getDate());
        }
      }

      const days = getMonthDays(year, month);

      for (const day of days) {

        const div = document.createElement("div");

        div.classList.add("day");

        if (playedDates.has(day.getDate())) {
          div.classList.add("played");
        }

        div.innerHTML =
          `${day.getDate()}<span></span>`;

        if (
          isCurrentMonth &&
          day.getDate() === today.getDate()
        ) {
          div.classList.add("today");
        }

        // 🔥 CLICK DAY
        div.onclick = () => openPopup(day);

        calendar.appendChild(div);
      }
    }

    // 🔥 OPEN POPUP

    function openPopup(day) {

      const popup =
        document.getElementById("popup");

      const popupGames =
        document.getElementById("popupGames");

      const popupTitle =
        document.getElementById("popupTitle");

      popup.style.display = "flex";

      popupTitle.textContent =
        day.toLocaleDateString();

      popupGames.innerHTML = "";

      let filtered = gameData.filter(g => {

        if(!g.date) return false;

        const d = new Date(g.date);

        return (
          d.getDate() === day.getDate() &&
          d.getMonth() === day.getMonth() &&
          d.getFullYear() === day.getFullYear()
        );
      });

      // 🔥 MERGE SAME GAMES
      const merged = {};

      filtered.forEach(g => {

        if(!merged[g.id]){

          merged[g.id] = {
            ...g,
            minutes: 0
          };
        }

        merged[g.id].minutes += g.minutes;
      });

      filtered = Object.values(merged);

      if(filtered.length === 0){

        popupGames.innerHTML = `
          <div style="
            text-align:center;
            color:#aaa;
          ">
            No games found
          </div>
        `;

        return;
      }

      filtered.sort((a,b)=>b.minutes-a.minutes);

      filtered.forEach(g => {

        const hours =
          Math.floor(g.minutes / 60);

        const mins =
          g.minutes % 60;

        popupGames.innerHTML += `

          <div class="gameCard">

            <img src="${g.image}">

            <div class="gameInfo">

              <div class="gameName">
                ${g.name}
              </div>

              <div class="gameTime">
                ${hours}h ${mins}m played
              </div>

            </div>

          </div>
        `;
      });
    }

    function closePopup(){
      document.getElementById("popup").style.display = "none";
    }

    // Swipe handling

    let touchStartX = 0;

    document.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
    });

    document.addEventListener("touchend", (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      handleSwipe(touchStartX, touchEndX);
    });

    document.addEventListener("mousedown", (e) => {
      touchStartX = e.clientX;
    });

    document.addEventListener("mouseup", (e) => {
      const touchEndX = e.clientX;
      handleSwipe(touchStartX, touchEndX);
    });

    function handleSwipe(startX, endX) {

      const diff = startX - endX;

      if (diff > 50) {

        currentDate.setMonth(
          currentDate.getMonth() + 1
        );

        buildCalendar();

      } else if (diff < -50) {

        currentDate.setMonth(
          currentDate.getMonth() - 1
        );

        buildCalendar();
      }
    }

    buildCalendar();

  </script>

</body>
</html>
