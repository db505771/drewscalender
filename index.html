<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Playtime Calendar</title>
  <style>
    body {
      background-color: #0f1a2b;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      touch-action: pan-y;
      overflow-x: hidden;
    }

    h1 {
      margin-bottom: 20px;
      text-align: center;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      max-width: 500px;
      transition: transform 0.3s ease;
    }

    .day {
      width: 60px;
      height: 60px;
      background-color: #1a2b3d;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
      font-size: 14px;
    }

    .day.played {
      background-color: #1e824c;
    }

    .day.today {
      border: 2px solid #00aced;
    }

    .day span {
      font-size: 20px;
    }
  </style>
</head>
<body>
  <h1 id="calendar-title">Loading...</h1>
  <div class="calendar" id="calendar"></div>

  <script>
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRo-SarpignS39lDSaIGsV13WyUJOURcyVaRP_mEqY6XfBxby9WA_XCf5AhXi8OcwHDiP4FLqBwMGKw/pub?output=csv";
    const gameApi =
  "https://script.google.com/macros/s/AKfycby5tKKny4hqGyG--JQxP4IVe2C8WWGO6sMij6p66MdSmLFVDUn6TbeBbM2L51TdWia_/exec";

let gameData = [];
    let currentDate = new Date();

    async function fetchData() {
      const res = await fetch(csvUrl);
      const text = await res.text();
      const rows = text.trim().split("\n").slice(1).map(row => row.split(","));
      return rows;
    }
async function fetchGameData() {
  const res = await fetch(gameApi);
  gameData = await res.json();
}
    
    function getMonthDays(year, month) {
      const date = new Date(year, month, 1);
      const days = [];
      while (date.getMonth() === month) {
        days.push(new Date(date));
        date.setDate(date.getDate() + 1);
      }
      return days;
    }

    async function buildCalendar() {
      const calendar = document.getElementById("calendar");
      const title = document.getElementById("calendar-title");
      calendar.innerHTML = "";

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const today = new Date();
      const isCurrentMonth = (month === today.getMonth() && year === today.getFullYear());
      const monthName = currentDate.toLocaleString("default", { month: "long" });
      title.textContent = `${monthName} ${year} Play Calendar`;

      const allRows = await fetchData();
      await fetchGameData();
      const playedDates = new Set();

      for (const row of allRows) {
        const rawDate = row[0];
        const minutesPlayed = parseInt(row[4]) || 0;
        const date = new Date(rawDate);
        if (date.getFullYear() === year && date.getMonth() === month && minutesPlayed > 0) {
          playedDates.add(date.getDate());
        }
      }

      const days = getMonthDays(year, month);

      for (const day of days) {
        const div = document.createElement("div");
        div.classList.add("day");

        if (playedDates.has(day.getDate())) {
          div.classList.add("played");
          div.innerHTML = `${day.getDate()}<span></span>`;
        } else {
          div.innerHTML = `${day.getDate()}<span></span>`;
        }

        if (isCurrentMonth && day.getDate() === today.getDate()) {
          div.classList.add("today");
        }
div.onclick = () => showGames(day);
        calendar.appendChild(div);
      }
    }

    // Swipe handling
    let touchStartX = 0;

    document.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
    });

    document.addEventListener("touchend", (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      handleSwipe(touchStartX, touchEndX);
    });

    document.addEventListener("mousedown", (e) => {
      touchStartX = e.clientX;
    });

    document.addEventListener("mouseup", (e) => {
      const touchEndX = e.clientX;
      handleSwipe(touchStartX, touchEndX);
    });

    function handleSwipe(startX, endX) {
      const diff = startX - endX;
      if (diff > 50) {
        currentDate.setMonth(currentDate.getMonth() + 1);
        buildCalendar();
      } else if (diff < -50) {
        currentDate.setMonth(currentDate.getMonth() - 1);
        buildCalendar();
      }
    }
function showGames(day){

  const existing = document.getElementById("popup");

  if(existing){
    existing.remove();
    return;
  }

  const popup = document.createElement("div");

  popup.id = "popup";

  popup.style.position = "fixed";
  popup.style.inset = "0";
  popup.style.background = "rgba(0,0,0,0.7)";
  popup.style.display = "flex";
  popup.style.justifyContent = "center";
  popup.style.alignItems = "center";
  popup.style.zIndex = "999";

  const box = document.createElement("div");

  box.style.background = "#1a2b3d";
  box.style.padding = "20px";
  box.style.borderRadius = "12px";
  box.style.width = "90%";
  box.style.maxWidth = "400px";
  box.style.maxHeight = "70vh";
  box.style.overflowY = "auto";

  const title = document.createElement("h2");

  title.innerText = day.toLocaleDateString();

  box.appendChild(title);

  const filtered = gameData.filter(g => {

    const d = new Date(g.date);

    return (
      d.getDate() === day.getDate() &&
      d.getMonth() === day.getMonth() &&
      d.getFullYear() === day.getFullYear()
    );
  });

  if(filtered.length === 0){

    const none = document.createElement("div");

    none.innerText = "No games found.";

    box.appendChild(none);

  } else {

    filtered.forEach(g => {

      const card = document.createElement("div");

      card.style.display = "flex";
      card.style.alignItems = "center";
      card.style.gap = "10px";
      card.style.marginBottom = "12px";
      card.style.background = "#24384f";
      card.style.padding = "10px";
      card.style.borderRadius = "10px";

      card.innerHTML = `
        <img
          src="${g.image}"
          style="
            width:60px;
            height:60px;
            border-radius:10px;
            object-fit:cover;
          "
        >

        <div>
          <div style="font-weight:bold;">
            ${g.name}
          </div>

          <div style="color:#ccc;font-size:14px;">
            ${Math.floor(g.minutes/60)}h ${g.minutes%60}m played
          </div>
        </div>
      `;

      box.appendChild(card);
    });
  }

  popup.appendChild(box);

  popup.onclick = () => popup.remove();

  document.body.appendChild(popup);
}
    buildCalendar();
  </script>
</body>
</html>
